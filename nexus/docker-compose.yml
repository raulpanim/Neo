services:
  neo4j:
    image: neo4j:5.15
    container_name: nexus-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/nexus_dev_pass
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p nexus_dev_pass 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports: ["6379:6379"]
    profiles: ["full"]

  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_PASSWORD: nexus_dev_pass
      POSTGRES_DB: nexus_cache
    ports: ["5432:5432"]
    profiles: ["full"]

volumes:
  neo4j_data:
