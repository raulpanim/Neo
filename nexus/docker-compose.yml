services:
  neo4j:
    image: neo4j:5.15
    container_name: nexus-neo4j
    # Loopback-only: nothing outside this host needs direct access, and on
    # a public VPS "7474:7474" would put the Neo4j browser and the bolt
    # port on the open internet for anyone to brute-force. `localhost`
    # still resolves here for local dev.
    ports:
      - "127.0.0.1:7474:7474"   # browser
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/nexus_dev_pass
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p nexus_dev_pass 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Persists live sync-job progress (src/redis.js) so it survives an API
  # restart. Not gated behind the "full" profile like postgres below - the
  # app still works without it (falls back to in-memory), but it's cheap
  # enough to just run by default.
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    # Loopback-only - this image has no auth configured, so on a public VPS
    # "6379:6379" would be an open, unauthenticated Redis on the internet.
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_PASSWORD: nexus_dev_pass
      POSTGRES_DB: nexus_cache
    ports: ["5432:5432"]
    profiles: ["full"]

volumes:
  neo4j_data:
