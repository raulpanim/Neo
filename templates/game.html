<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gem Swap RPG</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
</head>
<body>
<header class="topbar">
  <h1>💎 Gem Swap RPG</h1>
  <p class="subtitle">
    Walk with the arrow keys, WASD, or the pad below. Bump into an enemy to
    battle &mdash; swipe or drag gems to match 3+ and attack, hearts heal
    you. Level up and explore further!
  </p>
  <a class="back-link" href="{{ url_for('index') }}">&larr; Back to dashboard</a>
</header>

<main class="game-wrap">
  <section class="hud">
    <div class="fighter player">
      <div class="fighter-row">
        <span class="fighter-name">You &mdash; Lv <span id="level">1</span></span>
        <span class="fighter-hp-text"><span id="player-hp">100</span>/<span id="player-max-hp">100</span></span>
      </div>
      <div class="bar"><div id="player-bar" class="bar-fill player-fill"></div></div>
    </div>
    <div id="enemy-row" class="fighter enemy hidden">
      <div class="fighter-row">
        <span class="fighter-name" id="enemy-name">Slime</span>
        <span class="fighter-hp-text"><span id="enemy-hp">50</span>/<span id="enemy-max-hp">50</span></span>
      </div>
      <div class="bar"><div id="enemy-bar" class="bar-fill enemy-fill"></div></div>
    </div>
  </section>

  <div id="overworld" class="overworld">
    <div id="map" class="map"></div>
    <div class="dpad" aria-label="Movement controls">
      <button class="dpad-btn dpad-up" type="button" data-dir="up" aria-label="Walk up">&#9650;</button>
      <div class="dpad-mid">
        <button class="dpad-btn dpad-left" type="button" data-dir="left" aria-label="Walk left">&#9664;</button>
        <button class="dpad-btn dpad-right" type="button" data-dir="right" aria-label="Walk right">&#9654;</button>
      </div>
      <button class="dpad-btn dpad-down" type="button" data-dir="down" aria-label="Walk down">&#9660;</button>
    </div>
  </div>

  <div id="battle" class="battle hidden">
    <div class="board-area">
      <div id="board" class="board"></div>
      <div id="floaters" class="floaters"></div>
    </div>
  </div>

  <p id="message" class="message">Walk into an enemy to battle!</p>

  <div class="controls">
    <button id="restart-btn" type="button">Restart</button>
  </div>
</main>

<div id="overlay" class="overlay hidden">
  <div class="overlay-card">
    <h2 id="overlay-title">Victory!</h2>
    <p id="overlay-text"></p>
    <button id="overlay-btn" type="button">Continue</button>
  </div>
</div>

<script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
